name: Self-test

# TEMPORARY: verifies the multi-folder scanning change on a real runner.
# Delete this file before opening the PR.

on:
  push:
    branches:
      - multi-folder-update
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  multi-folder:
    name: Multiple folders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan multiple folders
        id: scan
        uses: ./
        with:
          path: |
            testdata/pkgmanager/go
            testdata/pkgmanager/python
            testdata/pkgmanager/rust
          output-file: "multi-folder-report.txt"
          artifact-name: "multi-folder-report"
          # No token: this verifies multi-folder discovery + report generation.
          # total-packages is a discovery count, so it's unaffected by the API.

      - name: Assert all folders were scanned
        shell: bash
        env:
          TOTAL: ${{ steps.scan.outputs.total-packages }}
        run: |
          echo "total-packages = $TOTAL"
          # go(5) + python(7) + rust(6) = 18
          if [ "$TOTAL" != "18" ]; then
            echo "::error::expected 18 packages across the three folders, got $TOTAL"
            exit 1
          fi
          echo "Multi-folder scan returned the expected package count."

  single-folder:
    name: Single folder (default behavior)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan one folder
        id: scan
        uses: ./
        with:
          path: "testdata/pkgmanager/go"
          output-file: "single-folder-report.txt"
          artifact-name: "single-folder-report"

      - name: Assert single folder was scanned
        shell: bash
        env:
          TOTAL: ${{ steps.scan.outputs.total-packages }}
        run: |
          echo "total-packages = $TOTAL"
          if [ "$TOTAL" != "5" ]; then
            echo "::error::expected 5 packages in the go folder, got $TOTAL"
            exit 1
          fi
          echo "Single-folder scan still works as before."
